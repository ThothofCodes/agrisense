name: AgriSense CI/CD

on:
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel in-progress runs for non-production workflows only.
  # Production deployments must never be cancelled mid-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/agrisense
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Secrets Leak Detection ─────────────────────────────────────────────────
  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Security Audit (CodeQL) ───────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ── Lint & Type-check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Lint all workspaces
        run: npm run lint --workspaces --if-present
      - name: Type-check API
        working-directory: apps/api
        run: npx tsc --noEmit
      - name: Type-check Web
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Python lint (flake8 & bandit)
        working-directory: apps/ml
        run: |
          pip install -r requirements-dev.txt
          flake8 . --count --show-source --statistics
          bandit -r . -ll

  # ── API Tests ──────────────────────────────────────────────────────────────
  test-api:
    name: API Tests (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: agrisense_test
          POSTGRES_USER: agrisense
          POSTGRES_PASSWORD: test_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Run API tests
        working-directory: apps/api
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_NAME: agrisense_test
          DB_USER: agrisense
          DB_PASSWORD: test_pass
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'test_secret_min_64_chars_padded_to_meet_requirement_xxx' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test_refresh_min_64_chars_padded_to_meet_requirement_x' }}

  # ── ML Tests ───────────────────────────────────────────────────────────────
  test-ml:
    name: ML Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python }} }
      - name: Install dependencies
        working-directory: apps/ml
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run ML tests
        working-directory: apps/ml
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term --cov-report=xml

  # ── Dependency Audit ──────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Check outdated deps
        run: npm outdated || true

  # ── Build & Push Docker Images ────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-ml, gitleaks, codeql]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [api, ml, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64${{ matrix.service != 'web' && ',linux/arm64' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker Image Vulnerability Scan ──────────────────────────────────────
  trivy:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    permissions: { contents: read, security-events: write }
    strategy:
      matrix:
        service: [api, ml, web]
    steps:
      - uses: actions/checkout@v4
      - name: Pull & scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          hide-progress: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ── Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build, trivy]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/develop'
    environment: staging
    env:
      IMAGE_TAG: develop
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/agrisense
            IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }} \
              docker compose pull
            IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }} \
              docker compose up -d --remove-orphans
            docker image prune -af --filter "until=24h"
          timeout: 120s

  # ── Deploy to Production ──────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, trivy]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    concurrency: production
    env:
      IMAGE_TAG: latest
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/agrisense
            IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }} \
              docker compose pull
            IMAGE_TAG=${{ env.IMAGE_TAG }} IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }} \
              docker compose up -d --remove-orphans
            docker image prune -af --filter "until=48h"
          timeout: 180s

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── Notify ─────────────────────────────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production, release]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}
          SLACK_TITLE: AgriSense Deployment ${{ contains(needs.*.result, 'failure') && 'Failed' || 'Succeeded' }}
          SLACK_MESSAGE: >
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
