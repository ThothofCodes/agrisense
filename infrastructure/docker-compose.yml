version: '3.9'

services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: agrisense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrisense
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: agrisense_secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/001_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agrisense_redis
    restart: unless-stopped
    command: redis-server --requirepass agrisense_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "agrisense_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mosquitto MQTT Broker ─────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: agrisense_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m ping -u agrisense -P mqtt_secret && echo OK"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ── Node.js API ────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${IMAGE_NAMESPACE:-agrisense}/agrisense-api:${IMAGE_TAG:-latest}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    # Local dev: use `docker compose up -d --build` to build from source
    # CI deploy: `docker compose pull` + `docker compose up -d` uses pre-built images
    container_name: agrisense_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://:agrisense_redis_pass@redis:6379
      MQTT_HOST: mqtt
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "3001:3001"

  # ── Python ML Service ──────────────────────────────────────────────────────────
  ml:
    image: ghcr.io/${IMAGE_NAMESPACE:-agrisense}/agrisense-ml:${IMAGE_TAG:-latest}
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: agrisense_ml
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── React Frontend ─────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${IMAGE_NAMESPACE:-agrisense}/agrisense-web:${IMAGE_TAG:-latest}
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: agrisense_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agrisense_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pg_data:
  redis_data:
  mqtt_data:
  mqtt_logs:
